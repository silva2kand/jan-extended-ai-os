[package]
name = "jan-extended-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
warp = "0.3" # For HTTP/WebSocket API
rusqlite = "0.29" # Memory Engine
lancedb = "0.1" # Vector Memory
sysinfo = "0.29" # OS stats
enigo = "0.1" # Mouse/Keyboard control
scrap = "0.5" # Screen capture
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[[bin]]
name = "jan-ext-server"
path = "src/main.rs"
